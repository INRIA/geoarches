name: Functional tests

on:
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  test:
    name: Run functional tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      #----------------------------------------------
      #  -----  install & configure uv  -----
      #----------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      #----------------------------------------------
      #       check dependency lock file
      #----------------------------------------------
      - name: Check lock file
        run: uv lock --check
      #----------------------------------------------
      #         install dependencies
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #          cache data files for tests
      #----------------------------------------------
      - name: Cache stats data
        run: |
          uv run python - <<'PY'
          from geoarches.stats import resolve_quantiles_file

          print(resolve_quantiles_file("era5-quantiles-2016_2022.nc"))
          PY
      #----------------------------------------------
      # Cache the entire modelstore directory
      #----------------------------------------------
      - name: Cache modelstore
        id: cache-modelstore
        uses: actions/cache@v4
        with:
          path: modelstore
          # Changes to your workflow or downloading script invalidate the cache
          key: modelstore-${{ hashFiles('.github/workflows/functional-tests.yml') }}
          restore-keys: |
            modelstore-
      - name: Copy model configs
        run : |
          MODELS=("archesweather-m-seed0" "archesweather-m-seed1" "archesweather-m-skip-seed0" "archesweather-m-skip-seed1" "archesweathergen")
          MODELS+=("aimip-archesweather-m-seed0" "aimip-archesweather-m-seed1" "aimip-archesweather-m-seed2" "aimip-archesweather-m-seed3" "aimip-archesweathergen")
          for MOD in "${MODELS[@]}"; do
              mkdir -p "modelstore/$MOD"
              cp paper/configs/$MOD.yaml modelstore/$MOD/config.yaml
          done

      - name: Download weather models checkpoints
        run: |
          src="https://huggingface.co/gcouairon/ArchesWeather/resolve/main"
          MODELS=("archesweather-m-seed0" "archesweather-m-seed1" "archesweather-m-skip-seed0" "archesweather-m-skip-seed1" "archesweathergen")
          
          for MOD in "${MODELS[@]}"; do
              CKPT_DIR="modelstore/$MOD/checkpoints"
              mkdir -p "$CKPT_DIR"
              if [ ! -f "$CKPT_DIR/checkpoint.ckpt" ]; then
                echo "Downloading $MOD from Hugging Face..."
                wget -q -O "$CKPT_DIR/checkpoint.ckpt" "$src/${MOD}_checkpoint.ckpt"
              else
                echo "Cached: $MOD"
              fi
          done
      - name: Download AIMIP models checkpoints
        run: |
          MODELS=(
            "aimip-archesweather-m-seed0"
            "aimip-archesweather-m-seed1"
            "aimip-archesweather-m-seed2"
            "aimip-archesweather-m-seed3"
            "aimip-archesweathergen"
          )

          MISSING=0
          for MOD in "${MODELS[@]}"; do
            if [ ! -f "modelstore/$MOD/checkpoints/checkpoint.ckpt" ]; then
                MISSING=1
                break
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "Missing AIMIP checkpoints detected. Downloading from Zenodo"

            sudo apt-get update && sudo apt-get install -y aria2

            # Fast multi-connection download (16 streams)
            aria2c -x 16 -s 16 -k 1M -q \
              "https://zenodo.org/records/22235637/files/model_checkpoints.zip?download=1" \
              -o modelstore/aimip.zip
          
            for MOD in "${MODELS[@]}"; do
              mkdir -p "modelstore/$MOD/checkpoints"
              # Extract only .ckpt files belonging to the model directory, ignoring zip path structure (-j flattens)
              unzip -q -j modelstore/aimip.zip "*$MOD*/*.ckpt" -d "modelstore/$MOD/checkpoints/" || true
            done
            rm -f modelstore/aimip.zip
          else
            echo "All AIMIP checkpoints present in cache."
          fi

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run functional tests
        run: uv run pytest -v tests/functional/ -s
        timeout-minutes: 15
