name: Functional tests

on:
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  test:
    name: Run functional tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      #----------------------------------------------
      #  -----  install & configure uv  -----
      #----------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      #----------------------------------------------
      #       check dependency lock file
      #----------------------------------------------
      - name: Check lock file
        run: uv lock --check
      #----------------------------------------------
      #         install dependencies
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #          cache data files for tests
      #----------------------------------------------
      - name: Cache stats data
        run: |
          uv run python - <<'PY'
          from geoarches.stats import resolve_quantiles_file

          print(resolve_quantiles_file("era5-quantiles-2016_2022.nc"))
          PY
      - name: Copy model configs
        run : |
          MODELS=("archesweather-m-seed0" "archesweather-m-seed1" "archesweather-m-skip-seed0" "archesweather-m-skip-seed1" "archesweathergen")
          MODELS+=("aimip-archesweather-m-seed0" "aimip-archesweather-m-seed1" "aimip-archesweather-m-seed2" "aimip-archesweather-m-seed3" "aimip-archesweathergen")
          for MOD in "${MODELS[@]}"; do
              mkdir -p "modelstore/$MOD"
              cp paper/configs/$MOD.yaml modelstore/$MOD/config.yaml
          done

      - name: Download weather models checkpoints
        run: |
          src="https://huggingface.co/gcouairon/ArchesWeather/resolve/main"
          MODELS=("archesweather-m-seed0" "archesweather-m-seed1" "archesweather-m-skip-seed0" "archesweather-m-skip-seed1" "archesweathergen")
          
          for MOD in "${MODELS[@]}"; do
              mkdir -p "modelstore/$MOD/checkpoints"
              wget -O "modelstore/$MOD/checkpoints/checkpoint.ckpt" "$src/${MOD}_checkpoint.ckpt"
          done
      - name: Download AIMIP models checkpoints
        run: |
          curl -sSL "https://zenodo.org/records/22235637/files/model_checkpoints.zip?download=1" -o modelstore/aimip.zip
          
          MODELS=(
            "aimip-archesweather-m-seed0"
            "aimip-archesweather-m-seed1"
            "aimip-archesweather-m-seed2"
            "aimip-archesweather-m-seed3"
            "aimip-archesweathergen"
          )
          
          for MOD in "${MODELS[@]}"; do
            mkdir -p "modelstore/$MOD/checkpoints"
            # Extract only .ckpt files belonging to the model directory, ignoring zip path structure (-j flattens)
            unzip -q -j modelstore/aimip.zip "*$MOD*/*.ckpt" -d "modelstore/$MOD/checkpoints/" || true
          done
          
          rm -f modelstore/aimip.zip

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run functional tests
        run: uv run pytest -v tests/functional/ -s
        timeout-minutes: 15
